<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Sales System</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

.container{
    display:flex;
    gap:20px;
}

/* MENU */
.sidebar{
    width:220px;
    background:#111827;
    padding:15px;
    border-radius:15px;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.menu button{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#1e293b;
    color:white;
    text-align:left;
}

.menu button:hover{
    background:#2563eb;
}

.logout{
    background:#dc2626;
    border:none;
    padding:10px;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

/* CONTEÚDO */
.main{
    flex:1;
}

/* CARD DASHBOARD */
.dashboard{
    display:flex;
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    flex:1;
}

/* FORM */
.form{
    background:#111827;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.form input{
    padding:10px;
    border:none;
    border-radius:8px;
}

.form button{
    padding:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
}

/* LISTA */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card-car{
    background:#1e293b;
    border-radius:12px;
    overflow:hidden;
}

.card-car img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.card-body{
    padding:10px;
}

.actions{
    display:flex;
    gap:10px;
}

.actions button{
    flex:1;
    border:none;
    padding:8px;
    border-radius:8px;
    color:white;
}

.edit{background:#f59e0b;}
.delete{background:#dc2626;}

</style>

</head>

<body>

<div id="app">

<div class="container">

<!-- MENU -->
<div class="sidebar">

<div>

<h3>MENU</h3>

<div class="menu">

<button @click="page='dashboard'">📊 Dashboard</button>
<button @click="page='adicionar'">➕ Adicionar</button>
<button @click="page='lista'">📋 Lista</button>
<button @click="page='gestao'">✏ Editar / Eliminar</button>

</div>

</div>

<!-- LOGOUT -->
<button class="logout" v-if="logado" @click="logout">
🚪 Logout
</button>

</div>

<!-- CONTEÚDO -->
<div class="main">

<!-- DASHBOARD -->
<div v-if="page==='dashboard'">

<div class="dashboard">

<div class="card">
<h3>Total Carros</h3>
<p>{{ carros.length }}</p>
</div>

<div class="card">
<h3>Status</h3>
<p>{{ logado ? 'Online' : 'Offline' }}</p>
</div>

</div>

</div>

<!-- LOGIN -->
<div class="form" v-if="!logado">

<h3>Login</h3>

<input v-model="username" placeholder="Username">
<input v-model="password" type="password" placeholder="Password">

<button @click="login">Entrar</button>

</div>

<!-- ADICIONAR -->
<div class="form" v-if="page==='adicionar'">

<h3>Adicionar Carro</h3>

<input v-model="carro.marca" placeholder="Marca">
<input v-model="carro.modelo" placeholder="Modelo">
<input v-model="carro.ano" placeholder="Ano">
<input v-model="carro.preco" placeholder="Preço">

<button @click="salvarCarro">Guardar</button>

</div>

<!-- LISTA -->
<div class="grid" v-if="page==='lista'">

<div class="card-car" v-for="c in carros" :key="c.id">

<img :src="getImagem(c.marca)">

<div class="card-body">

<h3>{{ c.marca }} {{ c.modelo }}</h3>
<p>{{ c.ano }} - {{ c.preco }} MZN</p>

</div>

</div>

</div>

<!-- GESTÃO -->
<div class="grid" v-if="page==='gestao'">

<div class="card-car" v-for="c in carros" :key="c.id">

<img :src="getImagem(c.marca)">

<div class="card-body">

<h3>{{ c.marca }} {{ c.modelo }}</h3>

<div class="actions">

<button class="edit" @click="editarCarro(c)">
Editar
</button>

<button class="delete" @click="eliminarCarro(c.id)">
Eliminar
</button>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

const { createApp } = Vue;

createApp({

data(){
return{

page:'dashboard',

carros:[],
username:'',
password:'',
logado:false,

carro:{
id:null,
marca:'',
modelo:'',
ano:'',
preco:''
}

}
},

mounted(){
this.carregarCarros();
},

methods:{

getImagem(marca){
return `https://source.unsplash.com/400x200/?car,${marca}`;
},

login(){
fetch("/api/login.php",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:this.username,
password:this.password
})
})
.then(r=>r.json())
.then(d=>{
if(d.user){
this.logado=true;
this.page='dashboard';
this.carregarCarros();
}else{
alert("Login inválido");
}
});
},

logout(){
this.logado=false;
},

carregarCarros(){
fetch("/api/carros.php")
.then(r=>r.json())
.then(d=>{
this.carros=d;
});
},

salvarCarro(){
fetch("/api/carros.php",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(this.carro)
})
.then(()=>this.carregarCarros());
},

eliminarCarro(id){
fetch("/api/carros.php",{
method:"DELETE",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({id})
})
.then(()=>this.carregarCarros());
},

editarCarro(c){
this.carro=c;
this.page='adicionar';
}

}

}).mount("#app");

</script>

</body>
</html>
