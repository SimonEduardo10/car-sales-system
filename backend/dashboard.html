<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Sales System</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f172a;
            color: white;
            padding: 30px;
        }

        header {
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 220px));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card-dashboard {
            background: #1e293b;
            padding: 18px;
            border-radius: 15px;
        }

        .form {
            background: #111827;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form input {
            padding: 12px;
            border-radius: 10px;
            border: none;
        }

        .form button {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b;
            border-radius: 15px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .edit { background: #f59e0b; }
        .delete { background: #dc2626; }

        button {
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div id="app">

    <header>
        <h1>🚗 Car Sales System</h1>

        <p v-if="logado" style="color:lightgreen;">
            ✔ Bem-vindo, {{ username }}
        </p>

        <p v-else style="color:red;">
            ❌ Acesso restrito
        </p>

        <button v-if="logado" class="delete" @click="logout">
            Sair
        </button>
    </header>

    <div class="dashboard">
        <div class="card-dashboard">
            <h2>Total Carros</h2>
            <p>{{ totalCarros }}</p>
        </div>

        <div class="card-dashboard">
            <h2>Estado</h2>
            <p>{{ logado ? 'Online' : 'Offline' }}</p>
        </div>
    </div>

    <!-- LOGIN -->
    <div class="form" v-if="!logado">
        <h2>Login Admin</h2>

        <input v-model="username" placeholder="Username">
        <input v-model="password" type="password" placeholder="Password">

        <button @click="login">Entrar</button>
    </div>

    <!-- FORM -->
    <div class="form">
        <h2>{{ carro.id ? 'Editar' : 'Adicionar' }} Carro</h2>

        <input v-model="carro.marca" placeholder="Marca">
        <input v-model="carro.modelo" placeholder="Modelo">
        <input v-model="carro.ano" type="number" placeholder="Ano">
        <input v-model="carro.preco" type="number" placeholder="Preço">
        <input v-model="carro.imagem" placeholder="Imagem">

        <button @click="salvarCarro" :disabled="!logado">
            Guardar
        </button>
    </div>

    <!-- LISTA -->
    <div class="grid">
        <div class="card" v-for="c in carros" :key="c.id">

            <img :src="c.imagem">

            <div class="card-content">
                <h2>{{ c.marca }} {{ c.modelo }}</h2>
                <p>{{ c.ano }} - {{ c.preco }} MZN</p>

                <div class="buttons">
                    <button class="edit" @click="editarCarro(c)" :disabled="!logado">Editar</button>
                    <button class="delete" @click="eliminarCarro(c.id)" :disabled="!logado">Eliminar</button>
                </div>
            </div>

        </div>
    </div>

</div>

<script>

const { createApp } = Vue;

createApp({

    data() {
        return {

            // 🔥 CORREÇÃO FINAL (PRODUÇÃO)
            API_BASE: "/api",

            carros: [],
            totalCarros: 0,

            carro: {
                id: null,
                marca: "",
                modelo: "",
                ano: "",
                preco: "",
                imagem: ""
            },

            username: "",
            password: "",
            logado: false
        }
    },

    mounted() {
        this.carregarCarros();
    },

    methods: {

        // LOGIN
        login() {

            fetch(`${this.API_BASE}/login.php`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: this.username,
                    password: this.password
                })
            })
            .then(r => r.json())
            .then(data => {

                if (data.user) {
                    this.logado = true;
                    alert("✔ Login OK");
                    this.carregarCarros();
                } else {
                    alert("❌ Login inválido");
                }

            })
            .catch(() => alert("Erro no login"));
        },

        // LOGOUT
        logout() {
            this.logado = false;
        },

        // CARROS
        carregarCarros() {

            fetch(`${this.API_BASE}/carros.php`)
                .then(r => r.json())
                .then(data => {
                    this.carros = data;
                    this.totalCarros = data.length;
                });
        },

        salvarCarro() {

            let url = `${this.API_BASE}/carros.php`;

            if (this.carro.id) url += "?action=update";

            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(this.carro)
            })
            .then(() => {
                this.carregarCarros();
                this.limpar();
            });
        },

        eliminarCarro(id) {

            fetch(`${this.API_BASE}/carros.php`, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id })
            })
            .then(() => this.carregarCarros());
        },

        editarCarro(c) {
            this.carro = { ...c };
        },

        limpar() {
            this.carro = {
                id: null,
                marca: "",
                modelo: "",
                ano: "",
                preco: "",
                imagem: ""
            };
        }

    }

}).mount("#app");

</script>

</body>
</html>
