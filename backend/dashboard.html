<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 Car Sales System</title>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:25px;
}

/* HEADER */
header{
    background:#111827;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card-dashboard{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
}

/* FILTERS */
.filters{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.filters input{
    padding:10px;
    border-radius:10px;
    border:none;
    width:100%;
}

/* FORM */
.form{
    background:#111827;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.form input{
    padding:10px;
    border-radius:8px;
    border:none;
}

.form button{
    padding:10px;
    border-radius:8px;
    border:none;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:15px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card-content{
    padding:12px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

button{
    border:none;
    padding:8px;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

.edit{ background:#f59e0b; }
.delete{ background:#dc2626; }

.chart{
    background:#111827;
    padding:15px;
    border-radius:15px;
    margin-bottom:20px;
}

</style>
</head>

<body>

<div id="app">

<header>
<h2>🚗 Car Sales Dashboard</h2>
<p v-if="logado">✔ {{ username }}</p>
<p v-else>❌ Offline</p>
</header>

<!-- DASHBOARD -->
<div class="dashboard">
    <div class="card-dashboard">
        <h3>Total Carros</h3>
        <p>{{ totalCarros }}</p>
    </div>

    <div class="card-dashboard">
        <h3>Marca Filtrada</h3>
        <p>{{ filtroMarca || 'Todas' }}</p>
    </div>
</div>

<!-- CHART -->
<div class="chart">
<canvas id="chart"></canvas>
</div>

<!-- FILTERS -->
<div class="filters">
    <input v-model="filtroMarca" placeholder="Filtrar por marca">
    <input v-model="filtroPreco" type="number" placeholder="Preço máximo">
</div>

<!-- LOGIN -->
<div class="form" v-if="!logado">
    <h3>Login</h3>
    <input v-model="username" placeholder="Username">
    <input v-model="password" type="password" placeholder="Password">
    <button @click="login">Entrar</button>
</div>

<!-- FORM -->
<div class="form">
    <h3>{{ carro.id ? 'Editar' : 'Adicionar' }} Carro</h3>

    <input v-model="carro.marca" placeholder="Marca">
    <input v-model="carro.modelo" placeholder="Modelo">
    <input v-model="carro.ano" placeholder="Ano">
    <input v-model="carro.preco" placeholder="Preço">

    <button @click="salvarCarro" :disabled="!logado">
        Guardar
    </button>
</div>

<!-- LISTA -->
<div class="grid">

    <div class="card" v-for="c in carrosFiltrados" :key="c.id">

        <img :src="getImagem(c.marca)">

        <div class="card-content">
            <h3>{{ c.marca }} {{ c.modelo }}</h3>
            <p>{{ c.ano }} - {{ c.preco }} MZN</p>

            <div class="buttons">
                <button class="edit" @click="editarCarro(c)">Editar</button>
                <button class="delete" @click="eliminarCarro(c.id)">Eliminar</button>
            </div>
        </div>

    </div>

</div>

</div>

<script>

const { createApp } = Vue;

createApp({

data() {
return {

API_BASE: "/api",

carros: [],
filtroMarca: "",
filtroPreco: "",

carro: {
id: null,
marca: "",
modelo: "",
ano: "",
preco: ""
},

username: "",
password: "",
logado: false
}
},

mounted() {
this.carregarCarros();
this.initChart();
},

computed: {

carrosFiltrados() {
return this.carros.filter(c => {

let okMarca = c.marca.toLowerCase().includes(this.filtroMarca.toLowerCase());

let okPreco = this.filtroPreco ? Number(c.preco) <= Number(this.filtroPreco) : true;

return okMarca && okPreco;
});
}

},

methods: {

// 🔥 IMAGEM AUTOMÁTICA
getImagem(marca){
if(!marca) return "https://via.placeholder.com/400x200";
return `https://source.unsplash.com/400x200/?car,${marca}`;
},

// LOGIN
login(){
fetch(this.API_BASE + "/login.php", {
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
username:this.username,
password:this.password
})
})
.then(r=>r.json())
.then(d=>{
if(d.user){
this.logado=true;
this.carregarCarros();
this.updateChart();
}
else alert("Login inválido");
});
},

// CARROS
carregarCarros(){
fetch(this.API_BASE + "/carros.php")
.then(r=>r.json())
.then(d=>{
this.carros=d;
this.totalCarros=d.length;
this.updateChart();
});
},

salvarCarro(){
if(!this.logado) return;

fetch(this.API_BASE + "/carros.php",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify(this.carro)
})
.then(()=>this.carregarCarros());
},

eliminarCarro(id){
fetch(this.API_BASE + "/carros.php",{
method:"DELETE",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({id})
})
.then(()=>this.carregarCarros());
},

editarCarro(c){
this.carro={...c};
},

// 📊 CHART
initChart(){
this.chart = new Chart(document.getElementById("chart"),{
type:"bar",
data:{
labels:[],
datasets:[{
label:"Carros por Marca",
data:[],
backgroundColor:"#2563eb"
}]
}
});
},

updateChart(){
let marcas={};

this.carros.forEach(c=>{
marcas[c.marca]=(marcas[c.marca]||0)+1;
});

this.chart.data.labels=Object.keys(marcas);
this.chart.data.datasets[0].data=Object.values(marcas);
this.chart.update();
}

}

}).mount("#app");

</script>

</body>
</html>
